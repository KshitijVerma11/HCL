services:
  road-accident-platform:
    build: .
    image: road-accident-risk-platform:local
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8000"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      RATE_LIMIT_WINDOW_MS: "${RATE_LIMIT_WINDOW_MS:-60000}"
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-120}"
      CARTO_API_KEY: "${CARTO_API_KEY:-}"
      MAP_TILE_URL: "${MAP_TILE_URL:-}"
    ports:
      - "${HOST_PORT:-8000}:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
